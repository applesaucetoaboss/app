name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests
          
      - name: Build frontend
        run: |
          cd frontend
          npm run build
          
      - name: Set up Capacitor
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ]; then npx cap init "Internet Access Miracle" "com.internetaccessmiracle.app" --web-dir=build; fi
          npx cap add android

      - name: Install AdMob plugin and sync
        run: |
          cd frontend
          npm install @capacitor-community/admob
          npx cap sync android

      - name: Add AdMob App ID to AndroidManifest
        env:
          ADMOB_APP_ID: ca-app-pub-7429469900417746~7081746845
        run: |
          MANIFEST="frontend/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/a \\    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'" \/>' "$MANIFEST"
          fi
          
      - name: Copy backend to Android assets
        run: |
          mkdir -p frontend/android/app/src/main/assets/backend
          cp -r backend/* frontend/android/app/src/main/assets/backend/
          
      - name: Update Android configuration
        run: |
          cd frontend
          npx cap sync android
          
      - name: Build Android APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug
          
      - name: Build Android App Bundle (unsigned release)
        run: |
          cd frontend/android
          ./gradlew bundleRelease
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
