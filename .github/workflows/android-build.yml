name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          
      - name: Build frontend
        run: |
          cd frontend
          npm run build
          
      - name: Set up Capacitor
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Internet Access Miracle" "com.internetaccessmiracle.app" --web-dir=build
          npx cap add android
          
      - name: Copy backend to Android assets
        run: |
          mkdir -p frontend/android/app/src/main/assets/backend
          cp -r backend/* frontend/android/app/src/main/assets/backend/
          
      - name: Update Android configuration
        run: |
          cd frontend
          npx cap sync android
          
      - name: Build Android APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk